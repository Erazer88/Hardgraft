<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071425">
  <meta name="description" content="Prototype de carte planétaire néon, générée par seed.">
  <title>Néréide — Prototype Neon Map</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030a13; }
    body { display: grid; place-items: center; }
    .stage {
      position: relative;
      width: min(100vw, 160vh);
      aspect-ratio: 1.6;
      overflow: hidden;
      background: #071425;
      box-shadow: 0 24px 90px #0009, 0 0 0 1px #27405a66;
      isolation: isolate;
    }
    #map { display: block; width: 100%; height: 100%; }
    .settings-toggle {
      position: absolute; z-index: 3; top: 14px; right: 14px;
      display: grid; place-items: center; width: 38px; height: 38px;
      border: 1px solid #8ba6bb33; border-radius: 11px;
      color: #c6d4df; background: #071421c9; box-shadow: 0 6px 24px #02070c66;
      cursor: pointer; backdrop-filter: blur(12px);
    }
    .settings-toggle:hover { border-color: #ff84b977; color: #fff; }
    .settings-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
    .panel {
      position: absolute; z-index: 4; top: 14px; right: 14px;
      width: min(340px, calc(100% - 28px)); padding: 16px;
      border: 1px solid #8ba6bb3d; border-radius: 14px;
      background: #071421ed; box-shadow: 0 18px 56px #0009;
      color: #c8d4df; backdrop-filter: blur(18px);
    }
    .panel[hidden] { display: none; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .panel-head div { display: grid; gap: 4px; }
    .eyebrow { color: #a4b7c7; font: 10px/1.2 ui-monospace, SFMono-Regular, monospace; letter-spacing: .22em; }
    .panel-title { color: #f0eaf1; font-size: 14px; font-weight: 600; letter-spacing: .035em; }
    .close {
      display: grid; place-items: center; width: 28px; height: 28px; border: 0;
      color: #afbfcc; background: transparent; font-size: 23px; cursor: pointer;
    }
    .field { display: grid; gap: 7px; margin: 12px 0; }
    .field-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    label, .field-heading span { color: #a8bac8; font-size: 11px; letter-spacing: .055em; }
    output { color: #f1afc9; font: 11px ui-monospace, monospace; }
    input[type="text"] {
      min-width: 0; width: 100%; height: 34px; padding: 0 10px;
      border: 1px solid #627b8e55; border-radius: 7px; outline: none;
      color: #e6edf2; background: #0b1d2d; font: 12px ui-monospace, monospace;
    }
    input[type="text"]:focus { border-color: #f278a5aa; }
    input[type="range"] { width: 100%; accent-color: #e56a9a; }
    .seed-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
    .lock { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .lock input { accent-color: #e56a9a; }
    .palette { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin: 15px 0 13px; }
    .color-control { display: grid; gap: 6px; }
    .color-control label { font-size: 9px; }
    input[type="color"] { width: 100%; height: 31px; padding: 3px; border: 1px solid #627b8e55; border-radius: 7px; background: #0b1d2d; cursor: pointer; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .action {
      min-height: 34px; border: 1px solid #60788c66; border-radius: 7px;
      color: #d7e1e8; background: #102335; font: 10px ui-monospace, monospace;
      letter-spacing: .08em; cursor: pointer;
    }
    .action.primary { border-color: #df77a477; background: #61294766; }
    .action:disabled { opacity: .4; cursor: not-allowed; }
    @media (max-width: 560px) {
      .stage { width: 100vw; }
      .settings-toggle, .panel { top: 9px; right: 9px; }
      .panel { padding: 13px; }
      .field { margin: 9px 0; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Carte planétaire rectangulaire">
    <canvas id="map" aria-label="Océan sombre, continents magenta et archipels sans relief ni marqueurs"></canvas>
    <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Ouvrir les réglages" title="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.3 13.3a7.5 7.5 0 0 0 0-2.6l1.5-1.2-1.7-3-1.8.7a7.3 7.3 0 0 0-2.2-1.3L14.8 4h-3.5l-.3 1.9a7.3 7.3 0 0 0-2.2 1.3L7 6.5l-1.7 3 1.5 1.2a7.5 7.5 0 0 0 0 2.6l-1.5 1.2 1.7 3 1.8-.7a7.3 7.3 0 0 0 2.2 1.3l.3 1.9h3.5l.3-1.9a7.3 7.3 0 0 0 2.2-1.3l1.8.7 1.7-3z"/></svg>
    </button>
    <aside class="panel" id="settings" hidden>
      <div class="panel-head">
        <div><span class="eyebrow">NÉRÉIDE · CARTOGRAPHIE</span><span class="panel-title">Prototype Neon Map · v0.2</span></div>
        <button class="close" id="close-settings" type="button" aria-label="Fermer les réglages">×</button>
      </div>
      <div class="field">
        <div class="field-heading"><label for="seed">Seed</label></div>
        <div class="seed-row">
          <input id="seed" type="text" value="NEREIDE-NEON-01" autocomplete="off" spellcheck="false">
          <label class="lock"><input id="lock-seed" type="checkbox" checked> Verrouillée</label>
        </div>
      </div>
      <div class="field">
        <div class="field-heading"><label for="continent-count">Grandes masses</label><output id="continent-value">3</output></div>
        <input id="continent-count" type="range" min="1" max="5" value="3">
      </div>
      <div class="field">
        <div class="field-heading"><label for="island-count">Îles secondaires</label><output id="island-value">34</output></div>
        <input id="island-count" type="range" min="0" max="72" value="34">
      </div>
      <div class="field">
        <div class="field-heading"><label for="coast-detail">Détail côtier</label><output id="detail-value">90 %</output></div>
        <input id="coast-detail" type="range" min="0" max="100" value="90">
      </div>
      <div class="field">
        <div class="field-heading"><label for="coast-glow">Lueur du littoral</label><output id="glow-value">42 %</output></div>
        <input id="coast-glow" type="range" min="0" max="100" value="42">
      </div>
      <div class="palette">
        <div class="color-control"><label for="ocean-color">OCÉAN</label><input id="ocean-color" type="color" value="#07182b"></div>
        <div class="color-control"><label for="land-color">TERRE</label><input id="land-color" type="color" value="#bd4d89"></div>
        <div class="color-control"><label for="coast-color">CÔTE</label><input id="coast-color" type="color" value="#ff87b7"></div>
      </div>
      <div class="actions">
        <button class="action primary" id="regenerate" type="button">RÉGÉNÉRER</button>
        <button class="action" id="new-seed" type="button">NOUVELLE SEED</button>
      </div>
    </aside>
  </main>
  <script>
    (() => {
      'use strict';

      const stage = document.querySelector('.stage');
      const canvas = document.querySelector('#map');
      const ctx = canvas.getContext('2d', { alpha: false });
      const settingsPanel = document.querySelector('#settings');
      const byId = id => document.getElementById(id);
      const state = { seed: 'NEREIDE-NEON-01', continents: 3, islands: 34, detail: 90, glow: 42,
        ocean: '#07182b', land: '#bd4d89', coast: '#ff87b7' };
      let pixelRatio = 1;

      function seededRandom(seedText) {
        let seed = 2166136261;
        for (let i = 0; i < seedText.length; i += 1) seed = Math.imul(seed ^ seedText.charCodeAt(i), 16777619);
        return () => {
          seed += 0x6D2B79F5;
          let value = seed;
          value = Math.imul(value ^ value >>> 15, value | 1);
          value ^= value + Math.imul(value ^ value >>> 7, value | 61);
          return ((value ^ value >>> 14) >>> 0) / 4294967296;
        };
      }
      const mix = (a, b, t) => a + (b - a) * t;
      const smooth = t => t * t * (3 - 2 * t);
      function hash2(x, y, seed) {
        let value = Math.imul(x | 0, 0x1f123bb5) ^ Math.imul(y | 0, 0x5f356495) ^ seed;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      }
      function noise2(x, y, seed) {
        const ix = Math.floor(x), iy = Math.floor(y), tx = smooth(x - ix), ty = smooth(y - iy);
        return mix(mix(hash2(ix, iy, seed), hash2(ix + 1, iy, seed), tx),
          mix(hash2(ix, iy + 1, seed), hash2(ix + 1, iy + 1, seed), tx), ty);
      }
      function fbm2(x, y, seed, octaves = 4) {
        let value = 0, amplitude = .56, total = 0, frequency = 1;
        for (let octave = 0; octave < octaves; octave += 1) {
          value += (noise2(x * frequency, y * frequency, seed + octave * 0x45d9f3b) - .5) * amplitude;
          total += amplitude;
          amplitude *= .52; frequency *= 2.03;
        }
        return value / total;
      }
      function makeShape(x, y, rx, ry, random, detail, minRadius = .72) {
        return { x, y, rx, ry, rotation: (random() - .5) * .8,
          seed: Math.floor(random() * 0x7fffffff), phase: random() * Math.PI * 2,
          points: Math.min(560, Math.max(96, Math.round(160 + detail * 3.4 * Math.min(1.5, rx * 5)))), minRadius };
      }
      function traceShape(target, shape, width, height, detail) {
        const { x, y, rx, ry, rotation, seed, phase, points } = shape;
        const co = Math.cos(rotation), si = Math.sin(rotation);
        target.beginPath();
        for (let i = 0; i <= points; i += 1) {
          const angle = i / points * Math.PI * 2;
          const cx = Math.cos(angle), cy = Math.sin(angle);
          const broad = fbm2(cx * 2.6 + 4.1, cy * 2.6 - 3.2, seed, 3);
          const mid = fbm2(cx * 8.2 - 2.7, cy * 8.2 + 1.8, seed ^ 0x7f4a7c15, 3);
          const fine = fbm2(cx * 22 + 6.3, cy * 22 - 4.8, seed ^ 0x165667b1, 2);
          const detailScale = detail / 100;
          const waves = Math.sin(angle * 3 + phase) * .045 + Math.sin(angle * 5 - phase * 1.7) * .030 +
            Math.sin(angle * 9 + phase * .61) * .015;
          const radius = Math.max(shape.minRadius, 1 + waves + broad * .48 + mid * (.12 + detailScale * .27) +
            fine * detailScale * .13);
          const lx = cx * rx * radius, ly = cy * ry * radius;
          const px = (x + lx * co - ly * si) * width;
          const py = (y + lx * si + ly * co) * height;
          if (i === 0) target.moveTo(px, py); else target.lineTo(px, py);
        }
        target.closePath();
      }
      function makeWorldShapes(seedText, detail) {
        const random = seededRandom(seedText);
        const continents = [], islandShapes = [];
        const fieldSeed = Math.floor(random() * 0x7fffffff);
        const count = state.continents;
        for (let i = 0; i < count; i += 1) {
          const lane = (i + .5) / count;
          const x = Math.max(.035, Math.min(.965, lane + (random() - .5) * .10));
          const y = .18 + random() * .64;
          const rx = (.24 / Math.sqrt(count)) * (.78 + random() * .42);
          const ry = Math.min(.34, rx * (.98 + random() * .72));
          continents.push({ x, y, rx, ry, rotation: (random() - .5) * .75 });
        }
        const clusterCount = state.islands ? Math.max(2, Math.ceil(state.islands / 8)) : 0;
        const clusters = Array.from({ length: clusterCount }, () => ({ x: .05 + random() * .90, y: .08 + random() * .84 }));
        for (let i = 0; i < state.islands; i += 1) {
          const cluster = clusters[i % clusters.length];
          const jitterX = (random() + random() + random() - 1.5) * .105;
          const jitterY = (random() + random() + random() - 1.5) * .15;
          const x = Math.max(.008, Math.min(.992, cluster.x + jitterX));
          const y = Math.max(.02, Math.min(.98, cluster.y + jitterY));
          const rx = .004 + Math.pow(random(), 1.4) * .017;
          const ry = .006 + Math.pow(random(), 1.3) * .024;
          islandShapes.push(makeShape(x, y, rx, ry, random, detail, .58));
        }
        return { continents, islands: islandShapes, fieldSeed };
      }
      function rgba(hex, alpha) {
        const value = Number.parseInt(hex.slice(1), 16);
        return `rgba(${value >> 16},${value >> 8 & 255},${value & 255},${alpha})`;
      }
      function brighter(hex, amount) {
        const value = Number.parseInt(hex.slice(1), 16);
        const channels = [value >> 16, value >> 8 & 255, value & 255].map(channel => Math.min(255, Math.round(channel * amount)));
        return '#' + channels.map(channel => channel.toString(16).padStart(2, '0')).join('');
      }
      function makeLandPigment(width, height, color, seedText) {
        // Low-amplitude pigment variation keeps the land flat (no height cues,
        // shadows or contour lines) while breaking the single-color sticker look.
        const texture = document.createElement('canvas');
        texture.width = Math.min(640, width);
        texture.height = Math.max(1, Math.round(height * texture.width / width));
        const textureCtx = texture.getContext('2d');
        const image = textureCtx.createImageData(texture.width, texture.height);
        const pixels = image.data;
        const base = Number.parseInt(color.slice(1), 16);
        const channels = [base >> 16, base >> 8 & 255, base & 255];
        const random = seededRandom(seedText + ':pigment');
        const seed = Math.floor(random() * 0x7fffffff);
        for (let y = 0; y < texture.height; y += 1) {
          const ny = y / texture.height;
          for (let x = 0; x < texture.width; x += 1) {
            const nx = x / texture.width;
            const macro = noise2(nx * 4.6 + 2.1, ny * 3.8 - 6.4, seed) - .5;
            const meso = noise2(nx * 16.8 - 9.2, ny * 13.6 + 3.7, seed ^ 0x9e3779b9) - .5;
            const fine = noise2(nx * 48.2 + 12.8, ny * 39.6 - 1.5, seed ^ 0x243f6a88) - .5;
            const grain = noise2(nx * 132.4 - 4.3, ny * 107.6 + 8.2, seed ^ 0xbb67ae85) - .5;
            const index = (y * texture.width + x) * 4;
            pixels[index] = Math.max(0, Math.min(255, Math.round(channels[0] * (1 + macro * .32 + meso * .16 + fine * .07))));
            pixels[index + 1] = Math.max(0, Math.min(255, Math.round(channels[1] * (1 + macro * .27 + meso * .14 + fine * .06 - grain * .06))));
            pixels[index + 2] = Math.max(0, Math.min(255, Math.round(channels[2] * (1 + macro * .32 + meso * .16 + fine * .07 + grain * .08))));
            pixels[index + 3] = 255;
          }
        }
        textureCtx.putImageData(image, 0, 0);
        return texture;
      }
      function buildMask(width, height, detail) {
        // Evaluate an implicit continental field rather than drawing noisy
        // ellipses. A low-frequency warp creates shelves and capes; increasingly
        // fine seeded bands break the coast into bays, inlets and small points.
        const fieldWidth = Math.min(width, 1800);
        const fieldHeight = Math.max(1, Math.round(height * fieldWidth / width));
        const mask = document.createElement('canvas');
        mask.width = fieldWidth; mask.height = fieldHeight;
        const maskCtx = mask.getContext('2d', { willReadFrequently: true });
        const { continents, islands, fieldSeed } = makeWorldShapes(state.seed, detail);
        for (const continent of continents) {
          continent.cos = Math.cos(continent.rotation);
          continent.sin = Math.sin(continent.rotation);
        }
        const image = maskCtx.createImageData(fieldWidth, fieldHeight);
        const pixels = image.data;
        const detailScale = detail / 100;
        const mediumFrequency = 8 + detailScale * 7;
        const fineFrequency = 23 + detailScale * 31;
        const microFrequency = 55 + detailScale * 75;
        const coastalFrequency = 128 + detailScale * 150;
        for (let y = 0; y < fieldHeight; y += 1) {
          const ny = y / Math.max(1, fieldHeight - 1);
          for (let x = 0; x < fieldWidth; x += 1) {
            const nx = x / Math.max(1, fieldWidth - 1);
            // Two differently scaled vector warps prevent the coast from reading
            // as a noisy ellipse: the first bends whole shelves, the second
            // breaks those shelves into long capes, bays and narrow inlets.
            const warpX = (noise2(nx * 2.2 + 3.7, ny * 1.8 - 5.2, fieldSeed ^ 0x3c6ef372) - .5) * .34 +
              (noise2(nx * 7.1 + 12.4, ny * 5.4 - 2.6, fieldSeed ^ 0x9e3779b9) - .5) * .10;
            const warpY = (noise2(nx * 2.0 - 8.3, ny * 2.0 + 9.1, fieldSeed ^ 0x1bf5a6d7) - .5) * .31 +
              (noise2(nx * 6.3 - 4.7, ny * 7.7 + 3.2, fieldSeed ^ 0x243f6a88) - .5) * .09;
            const wx = nx + warpX, wy = ny + warpY;
            let continentalCore = -2;
            for (const continent of continents) {
              const dx = wx - continent.x, dy = wy - continent.y;
              const rx = (dx * continent.cos + dy * continent.sin) / continent.rx;
              const ry = (-dx * continent.sin + dy * continent.cos) / continent.ry;
              continentalCore = Math.max(continentalCore, 1 - Math.hypot(rx, ry));
            }
            const broad = (noise2(wx * 3.7 + 5.3, wy * 2.8 - 4.7, fieldSeed ^ 0x5a827999) - .5) * 1.02;
            const medium = (noise2(wx * mediumFrequency + 11.8, wy * mediumFrequency * .72 + 6.1,
              fieldSeed ^ 0xbb67ae85) - .5) * (.30 + detailScale * .34);
            const fine = (noise2(wx * fineFrequency - 16.4, wy * fineFrequency * .70 + 2.8,
              fieldSeed ^ 0x6a09e667) - .5) * (.10 + detailScale * .17);
            const shapeField = continentalCore + broad + medium + fine;
            let coastalDetail = 0;
            // Spend high-frequency work only near the shoreline. A four-octave
            // coastal fractal creates nested headlands, coves and tiny inlets;
            // unlike a polygon outline, every scale follows one continuous field.
            if (detailScale > 0 && Math.abs(shapeField) < .40) {
              const coastX = wx + (noise2(wx * 19.3 + 7.2, wy * 15.7 - 3.6,
                fieldSeed ^ 0x3c6ef35f) - .5) * .010;
              const coastY = wy + (noise2(wx * 16.1 - 9.4, wy * 21.7 + 5.3,
                fieldSeed ^ 0xa54ff53a) - .5) * .010;
              // Rotate the coastal field away from the canvas axes, which keeps
              // its small coves from lining up into obvious horizontal streaks.
              const coastU = (coastX * .83 + coastY * .58) * coastalFrequency * .22 - 31.6;
              const coastV = (-coastX * .58 + coastY * .83) * coastalFrequency * .16 + 17.2;
              const fractalCoast = fbm2(coastU, coastV, fieldSeed ^ 0xa54ff53a, 4);
              const micro = (noise2(wx * microFrequency * .82 + wy * microFrequency * .31 + 23.1,
                -wx * microFrequency * .31 + wy * microFrequency * .55 - 19.7,
                fieldSeed ^ 0x3c6ef35f) - .5) * detailScale * .10;
              const coast = (noise2(coastU * 1.18, coastV * 1.18,
                fieldSeed ^ 0x165667b1) - .5) * detailScale * .07;
              coastalDetail = detailScale * fractalCoast * .40 + micro + coast;
            }
            const land = shapeField + coastalDetail > 0;
            const offset = (y * fieldWidth + x) * 4;
            pixels[offset] = 255; pixels[offset + 1] = 255; pixels[offset + 2] = 255;
            pixels[offset + 3] = land ? 255 : 0;
          }
        }
        maskCtx.putImageData(image, 0, 0);
        maskCtx.fillStyle = '#fff';
        for (const island of islands) { traceShape(maskCtx, island, fieldWidth, fieldHeight, detail); maskCtx.fill(); }
        const softened = document.createElement('canvas'); softened.width = fieldWidth; softened.height = fieldHeight;
        const softenCtx = softened.getContext('2d');
        softenCtx.filter = 'blur(.7px)'; softenCtx.drawImage(mask, 0, 0); softenCtx.filter = 'none';
        const softenedImage = softenCtx.getImageData(0, 0, fieldWidth, fieldHeight), softenedPixels = softenedImage.data;
        for (let i = 3; i < softenedPixels.length; i += 4) {
          const alpha = softenedPixels[i];
          softenedPixels[i] = alpha < 90 ? 0 : alpha > 235 ? 255 : Math.round((alpha - 90) * 255 / 145);
          softenedPixels[i - 3] = 255; softenedPixels[i - 2] = 255; softenedPixels[i - 1] = 255;
        }
        softenCtx.putImageData(softenedImage, 0, 0);
        return softened;
      }
      function makeEdgeMask(mask, color) {
        const width = mask.width, height = mask.height, source = mask.getContext('2d').getImageData(0, 0, width, height).data;
        const edge = document.createElement('canvas'); edge.width = width; edge.height = height;
        const edgeCtx = edge.getContext('2d'), output = edgeCtx.createImageData(width, height), pixels = output.data;
        const colorValue = Number.parseInt(color.slice(1), 16);
        const red = colorValue >> 16, green = colorValue >> 8 & 255, blue = colorValue & 255;
        for (let y = 1; y < height - 1; y += 1) for (let x = 1; x < width - 1; x += 1) {
          const index = (y * width + x) * 4;
          if (source[index + 3] < 128) continue;
          const empty = source[index - 4 + 3] < 128 || source[index + 4 + 3] < 128 ||
            source[index - width * 4 + 3] < 128 || source[index + width * 4 + 3] < 128;
          if (!empty) continue;
          pixels[index] = red; pixels[index + 1] = green; pixels[index + 2] = blue; pixels[index + 3] = 235;
        }
        edgeCtx.putImageData(output, 0, 0);
        return edge;
      }
      function drawOcean(width, height) {
        const gradient = ctx.createLinearGradient(0, 0, width * .2, height);
        gradient.addColorStop(0, brighter(state.ocean, 1.13));
        gradient.addColorStop(.52, state.ocean);
        gradient.addColorStop(1, brighter(state.ocean, .78));
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
        ctx.save();
        ctx.lineWidth = Math.max(.6, pixelRatio * .65);
        const minor = rgba('#75a4c4', .075), major = rgba('#8ab0c9', .115);
        for (let column = 1; column < 28; column += 1) {
          ctx.strokeStyle = column % 4 === 0 ? major : minor;
          ctx.beginPath(); ctx.moveTo(width * column / 28, 0); ctx.lineTo(width * column / 28, height); ctx.stroke();
        }
        for (let row = 1; row < 16; row += 1) {
          ctx.strokeStyle = row % 4 === 0 ? major : minor;
          ctx.beginPath(); ctx.moveTo(0, height * row / 16); ctx.lineTo(width, height * row / 16); ctx.stroke();
        }
        ctx.restore();
      }
      function render() {
        const bounds = stage.getBoundingClientRect();
        pixelRatio = Math.min(2, window.devicePixelRatio || 1);
        const width = Math.max(1, Math.round(bounds.width * pixelRatio));
        const height = Math.max(1, Math.round(bounds.height * pixelRatio));
        if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
        drawOcean(width, height);
        const mask = buildMask(width, height, state.detail);
        const edge = makeEdgeMask(mask, state.coast);
        const glow = state.glow / 100;

        // A single union mask means only the actual coastline emits light.
        const glowSource = document.createElement('canvas'); glowSource.width = width; glowSource.height = height;
        const glowCtx = glowSource.getContext('2d');
        glowCtx.fillStyle = state.coast; glowCtx.fillRect(0, 0, width, height);
        glowCtx.globalCompositeOperation = 'destination-in'; glowCtx.drawImage(mask, 0, 0);
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = .14 + glow * .44;
        ctx.shadowColor = rgba(state.coast, .92);
        ctx.shadowBlur = (2 + glow * 13) * pixelRatio;
        ctx.drawImage(glowSource, 0, 0);
        ctx.restore();

        const landCanvas = document.createElement('canvas'); landCanvas.width = width; landCanvas.height = height;
        const landCtx = landCanvas.getContext('2d');
        landCtx.drawImage(makeLandPigment(width, height, state.land, state.seed), 0, 0, width, height);
        landCtx.globalCompositeOperation = 'destination-in'; landCtx.drawImage(mask, 0, 0);
        ctx.drawImage(landCanvas, 0, 0);

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = .54 + glow * .34;
        ctx.shadowColor = rgba(state.coast, .95);
        ctx.shadowBlur = (1.5 + glow * 5.5) * pixelRatio;
        ctx.drawImage(edge, 0, 0);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = .62 + glow * .30;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(edge, 0, 0);
        ctx.restore();
      }
      function readControls() {
        state.seed = byId('seed').value.trim() || 'NEREIDE-NEON-01';
        state.continents = Number(byId('continent-count').value);
        state.islands = Number(byId('island-count').value);
        state.detail = Number(byId('coast-detail').value);
        state.glow = Number(byId('coast-glow').value);
        state.ocean = byId('ocean-color').value;
        state.land = byId('land-color').value;
        state.coast = byId('coast-color').value;
        byId('continent-value').value = state.continents;
        byId('island-value').value = state.islands;
        byId('detail-value').value = state.detail + ' %';
        byId('glow-value').value = state.glow + ' %';
      }
      function randomSeed() { return 'NEON-' + Math.random().toString(36).slice(2, 8).toUpperCase(); }
      function setPanel(open) {
        settingsPanel.hidden = !open;
        byId('settings-toggle').hidden = open;
      }
      function resize() { render(); }

      byId('settings-toggle').addEventListener('click', () => setPanel(true));
      byId('close-settings').addEventListener('click', () => setPanel(false));
      byId('regenerate').addEventListener('click', () => { readControls(); render(); });
      byId('new-seed').addEventListener('click', () => {
        if (byId('lock-seed').checked) return;
        byId('seed').value = randomSeed(); readControls(); render();
      });
      byId('lock-seed').addEventListener('change', event => { byId('new-seed').disabled = event.target.checked; });
      for (const id of ['continent-count', 'island-count', 'coast-detail', 'coast-glow']) {
        byId(id).addEventListener('input', readControls);
        // Coast generation is intentionally committed on release. At full map
        // resolution it is too costly to rebuild on every pointer-move event.
        byId(id).addEventListener('change', () => { readControls(); render(); });
      }
      for (const id of ['ocean-color', 'land-color', 'coast-color']) {
        byId(id).addEventListener('input', () => { readControls(); render(); });
      }
      byId('seed').addEventListener('change', () => { readControls(); render(); });
      new ResizeObserver(resize).observe(stage);
      byId('new-seed').disabled = byId('lock-seed').checked;
      readControls(); render();
    })();
  </script>
</body>
</html>
